* {

html,

/* =========================
   PANEL
========================= */

#panel {
  position: absolute;
  z-index: 1000;

  top: 10px;
  left: 10px;

  max-width: calc(100vw - 20px);

  backdrop-filter: blur(8px);

    transform 0.25s ease,
    opacity 0.25s ease;
}

#panel h2 {
  margin: 0 0 10px 0;
  font-size: 18px;
}

.category {
  display: flex;
  align-items: center;
  gap: 8px;

  padding: 7px 4px;
  border-radius: 7px;

  cursor: pointer;
  user-select: none;
}

.category:hover {
  background: rgba(255, 255, 255, 0.08);
}

.category input {
  width: 18px;
  height: 18px;
  cursor: pointer;
}

.category-name {
  flex: 1;
  font-size: 14px;
}

.category-count {
  min-width: 22px;
  padding: 2px 6px;

}

#status {

/* =========================================================
   MAP
========================================================= */

const map =
  L.map("map", {
    zoomControl: true
  }).setView([47.60, 32.25], 6);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {

    attribution: "© OpenStreetMap contributors"
  }
).addTo(map);

/* =========================================================
   LAYERS
========================================================= */

const sheetLayerGroup = L.layerGroup().addTo(map);
const neptunThreatLayerGroup = L.layerGroup().addTo(map);
const neptunRaionLayerGroup = L.layerGroup().addTo(map);
const neptunOblastLayerGroup = L.layerGroup().addTo(map);

/* =========================================================
   DATA
========================================================= */

let sheetObjects = [];
let neptunThreats = [];
let neptunAlerts = [];
let neptunAlertOblasts = [];
let radarAlerts = [];

let raionsGeoJSON = null;
let oblastsGeoJSON = null;

/* =========================================================
   OFFLINE INDEXEDDB & STORAGE
========================================================= */

const OFFLINE_DB_NAME = "MapaPodiyUA_Offline";
const OFFLINE_DB_VERSION = 1;
const OFFLINE_STORE_NAME = "mapCache";
const OFFLINE_CACHE_KEY = "state";
const OFFLINE_LOCAL_KEY = "MapaPodiyUA_Offline_v2";

let offlineDBPromise = null;
let offlineCacheSavedAt = 0;
let offlineCacheLoaded = false;
let offlineWriteQueue = Promise.resolve();

function openOfflineDB() {
  if (offlineDBPromise) return offlineDBPromise;

  offlineDBPromise = new Promise((resolve, reject) => {
    if (!("indexedDB" in window)) {
      reject(new Error("IndexedDB не підтримується"));
      return;
    }

    const request = indexedDB.open(OFFLINE_DB_NAME, OFFLINE_DB_VERSION);

    request.onupgradeneeded = function(event) {
      const db = event.target.result;
      if (!db.objectStoreNames.contains(OFFLINE_STORE_NAME)) {
        db.createObjectStore(OFFLINE_STORE_NAME);
      }
    };

    request.onsuccess = function(event) {
      const db = event.target.result;
      db.onversionchange = function() { db.close(); };
      resolve(db);
    };

    request.onerror = function() {
      reject(request.error || new Error("Помилка IndexedDB"));
    };
  });

  return offlineDBPromise;
}

function saveOfflineState() {
  offlineWriteQueue = offlineWriteQueue
    .then(async () => {
      const state = {
        version: OFFLINE_DB_VERSION,
        savedAt: Date.now(),
        sheetObjects: Array.isArray(sheetObjects) ? sheetObjects : [],
        neptunThreats: Array.isArray(neptunThreats) ? neptunThreats : [],
        neptunAlerts: Array.isArray(neptunAlerts) ? neptunAlerts : [],
        neptunAlertOblasts: Array.isArray(neptunAlertOblasts) ? neptunAlertOblasts : [],
        radarAlerts: Array.isArray(radarAlerts) ? radarAlerts : [],
        raionsGeoJSON: raionsGeoJSON || null,
        oblastsGeoJSON: oblastsGeoJSON || null
      };

      let saved = false;

      try {
        const db = await openOfflineDB();
        await new Promise((resolve, reject) => {
          const transaction = db.transaction(OFFLINE_STORE_NAME, "readwrite");
          const store = transaction.objectStore(OFFLINE_STORE_NAME);
          const request = store.put(state, OFFLINE_CACHE_KEY);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
        saved = true;
      } catch (error) {
        console.warn("OFFLINE: IndexedDB save failed:", error);
      }

      // Не зберігаємо важкий GeoJSON в localStorage задля уникнення лагів
      try {
        const lightState = { ...state, raionsGeoJSON: null, oblastsGeoJSON: null };
        localStorage.setItem(OFFLINE_LOCAL_KEY, JSON.stringify(lightState));
        saved = true;
      } catch (error) {
        console.warn("OFFLINE: localStorage save failed:", error);
      }

      if (saved) {
        offlineCacheSavedAt = state.savedAt;
        offlineCacheLoaded = true;
        updateStatus();
      }
    })
    .catch(error => {
      console.warn("OFFLINE: помилка збереження:", error);
      updateStatus();
    });

  return offlineWriteQueue;
}

async function loadOfflineState() {
  try {
    const db = await openOfflineDB();
    const state = await new Promise((resolve, reject) => {
      const transaction = db.transaction(OFFLINE_STORE_NAME, "readonly");
      const store = transaction.objectStore(OFFLINE_STORE_NAME);
      const request = store.get(OFFLINE_CACHE_KEY);
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
    });

    if (state && state.version === OFFLINE_DB_VERSION) {
      return state;
    }
  } catch (error) {
    console.warn("OFFLINE: IndexedDB read failed:", error);
  }

  try {
    const raw = localStorage.getItem(OFFLINE_LOCAL_KEY);
    if (raw) {
      const state = JSON.parse(raw);
      if (state && state.version === OFFLINE_DB_VERSION) return state;
    }
  } catch (error) {
    console.warn("OFFLINE: localStorage read failed:", error);
  }

  return null;
}

function formatCacheAge(timestamp) {
  if (!timestamp || !Number.isFinite(Number(timestamp))) return "невідомо";
  const diff = Math.max(0, Date.now() - Number(timestamp));
  const seconds = Math.floor(diff / 1000);
  if (seconds < 60) return seconds + " сек. тому";
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return minutes + " хв. тому";
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return hours + " год. тому";
  return Math.floor(hours / 24) + " дн. тому";
}

async function restoreOfflineState() {
  const state = await loadOfflineState();
  if (!state) return false;

  if (Array.isArray(state.sheetObjects)) sheetObjects = state.sheetObjects;
  if (Array.isArray(state.neptunThreats)) neptunThreats = state.neptunThreats;
  if (Array.isArray(state.neptunAlerts)) neptunAlerts = state.neptunAlerts;
  if (Array.isArray(state.neptunAlertOblasts)) neptunAlertOblasts = state.neptunAlertOblasts;
  if (Array.isArray(state.radarAlerts)) radarAlerts = state.radarAlerts;
  if (state.raionsGeoJSON) raionsGeoJSON = state.raionsGeoJSON;
  if (state.oblastsGeoJSON) oblastsGeoJSON = state.oblastsGeoJSON;

  offlineCacheSavedAt = Number(state.savedAt) || 0;
  offlineCacheLoaded = true;

  renderSheetObjects();
  renderNeptunThreats();
  renderAlertZones();
  updateVisibility();
  updateStatus();

  return true;
}

/* =========================================================
   EVENTS
========================================================= */

window.addEventListener("offline", updateStatus);

window.addEventListener("online", function() {
  updateStatus();

/* =========================================================
   CATEGORY PANEL & VISIBILITY
========================================================= */

const visibleCategories = {};
Object.keys(categories).forEach(id => {
  visibleCategories[id] = categories[id].show;
});

const panel = document.getElementById("panel");
const panelToggle = document.getElementById("panelToggle");
const panelClose = document.getElementById("panelClose");

function openPanel() {
  if (!panel) return;
  panel.classList.add("panel-open");
  if (panelToggle) panelToggle.textContent = "✕";
}

function closePanel() {
  if (!panel) return;
  panel.classList.remove("panel-open");
  if (panelToggle) panelToggle.textContent = "☰";
}

function togglePanel() {
  if (!panel) return;
  panel.classList.contains("panel-open") ? closePanel() : openPanel();
}

if (panelToggle) panelToggle.addEventListener("click", togglePanel);
if (panelClose) panelClose.addEventListener("click", closePanel);

function isMobileDevice() {
  return window.innerWidth <= 600;
}

function createCategoryPanel() {
  const container = document.getElementById("categories");
  container.innerHTML = "";

  Object.entries(categories).forEach(([id, category]) => {
    const row = document.createElement("label");
    row.className = "category";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = visibleCategories[id];
    checkbox.dataset.category = id;

    checkbox.addEventListener("change", function() {
      visibleCategories[id] = this.checked;
      updateVisibility();
      if (isMobileDevice()) closePanel();
    });

    const name = document.createElement("span");
    name.className = "category-name";
    name.textContent = category.name;

    const count = document.createElement("span");
    count.className = "category-count";
    count.id = "count-" + id;
    count.textContent = "0";

    row.appendChild(checkbox);
    row.appendChild(name);
    row.appendChild(count);
    container.appendChild(row);
  });
}

function normalizeType(type) {
  return String(type ?? "").trim().toLowerCase();
}

function getSheetCategory(obj) {
  return String(obj.type ?? "").trim();
}

function createEmojiIcon(emoji, color) {
  return L.divIcon({
    className: "",
    html: `<div class="emoji-marker" style="border-color:${color};box-shadow:0 0 10px ${color},0 2px 8px rgba(0,0,0,.5);">${emoji}</div>`,
    iconSize: [34, 34],
    iconAnchor: [17, 17]
  });
}

function createNeptunThreatIcon(type) {
  let emoji = "✈️";
  const norm = normalizeType(type);
  if (norm === "missile" || norm === "rocket") emoji = "🚀";
  else if (norm === "uav") emoji = "✈️";

  return L.divIcon({
    className: "",
    html: `<div class="neptun-threat-marker">${emoji}</div>`,
    iconSize: [38, 38],
    iconAnchor: [19, 19]
  });
}

/* =========================================================
   RENDER SHEET OBJECTS
========================================================= */

function renderSheetObjects() {
  sheetLayerGroup.clearLayers();

  sheetObjects.forEach(obj => {
    const categoryId = getSheetCategory(obj);
    const category = categories[categoryId];
    if (!category) return;

    const lat = Number(obj.lat);
    const lng = Number(obj.lng);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

    const group = L.layerGroup();
    const marker = L.marker([lat, lng], {
      icon: createEmojiIcon(category.emoji, category.color)
    });

    let radius = Number(obj.radius);
    if (!Number.isFinite(radius)) radius = category.radius;

    if (radius > 0 && !obj.geojson) {
      L.circle([lat, lng], {
        radius: radius,
        color: category.color,
        fillColor: category.color,
        fillOpacity: 0.12,
        weight: 2
      }).addTo(group);
    }

    if (obj.geojson) {
      try {
        const geo = typeof obj.geojson === "string" ? JSON.parse(obj.geojson) : obj.geojson;
        L.geoJSON(geo, {
          style: {
            color: category.color,
            weight: 3,
            fillColor: category.color,
            fillOpacity: 0.18
          }
        }).addTo(group);
      } catch (error) {
        console.warn("Помилка GeoJSON:", error);
      }
    }

    if (categoryId === "13") {
      const title = obj.title || obj.desc || "Новина";
      const source = obj.source || "Джерело";
      const published = obj.published || "";
      const url = obj.url || "";

      marker.bindPopup(`
        <div style="min-width:220px">
          <div style="font-size:16px;font-weight:bold;margin-bottom:8px;">📰 ${title}</div>
          ${source ? `<div style="color:#777;font-size:12px;margin-bottom:6px;">Джерело: ${source}</div>` : ""}
          ${published ? `<div style="color:#888;font-size:11px;margin-bottom:8px;">${published}</div>` : ""}
          ${obj.desc && obj.title ? `<div style="margin-bottom:10px;">${obj.desc}</div>` : ""}
          ${url ? `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:#0088cc;font-weight:bold;">Відкрити джерело →</a>` : ""}
        </div>
      `);
    } else {
      marker.bindPopup(`
        <b>${category.name}</b><br><br>
        ${obj.desc ? String(obj.desc) : ""}
        ${obj.village ? `<br><br>від ${obj.village}` : ""}
      `);
    }

    marker.addTo(group);
    group._category = categoryId;
    group._sheetObject = true;
    group.addTo(sheetLayerGroup);
  });
}

/* =========================================================
   UPDATE VISIBILITY & COUNTS
========================================================= */

function updateVisibility() {
  sheetLayerGroup.eachLayer(layer => {
    const category = layer._category;
    if (visibleCategories[category]) {
      if (!map.hasLayer(layer)) map.addLayer(layer);
    } else {
      if (map.hasLayer(layer)) map.removeLayer(layer);
    }
  });

  if (visibleCategories[NEPTUN_CATEGORY_UAV]) {
    if (!map.hasLayer(neptunThreatLayerGroup)) map.addLayer(neptunThreatLayerGroup);
  } else {
    if (map.hasLayer(neptunThreatLayerGroup)) map.removeLayer(neptunThreatLayerGroup);
  }

  if (visibleCategories[NEPTUN_CATEGORY_ALERT]) {
    if (!map.hasLayer(neptunRaionLayerGroup)) map.addLayer(neptunRaionLayerGroup);
    if (!map.hasLayer(neptunOblastLayerGroup)) map.addLayer(neptunOblastLayerGroup);
  } else {
    if (map.hasLayer(neptunRaionLayerGroup)) map.removeLayer(neptunRaionLayerGroup);
    if (!map.hasLayer(neptunOblastLayerGroup)) map.removeLayer(neptunOblastLayerGroup);
  }

  updateCategoryCounts();
}

function updateCategoryCounts() {
  const counts = {};
  Object.keys(categories).forEach(id => counts[id] = 0);

  sheetObjects.forEach(obj => {
    const type = getSheetCategory(obj);
    if (counts[type] !== undefined) counts[type]++;
  });

  neptunThreats.forEach(threat => {
    const category = getNeptunThreatCategory(threat);
    if (counts[category] !== undefined) counts[category]++;
  });

  counts["1"] += neptunAlerts.length;
  counts["1"] += neptunAlertOblasts.length;
  counts["1"] += radarAlerts.length;

  Object.keys(categories).forEach(id => {
    const element = document.getElementById("count-" + id);
    if (element) element.textContent = counts[id];
  });
}

/* =========================================================
   LOAD DATA SOURCES
========================================================= */

async function loadSheetData() {
  try {
    const response = await fetch(API_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("API повернув не масив");

    sheetObjects = data;
    renderSheetObjects();
    updateVisibility();
    updateStatus();
    await saveOfflineState();
  } catch (error) {
    console.error("Google Sheets:", error);
    updateStatus();
  }
}

async function loadRadarAlerts() {
  try {
    const response = await fetch(RADAR_ALERTS_URL, { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();

    radarAlerts = Array.isArray(data) ? data : (data.alerts || []);
    renderAlertZones();
    updateCategoryCounts();
    updateStatus();
  } catch (error) {
    console.error("Radar Alerts:", error);
  }
}

/* =========================================================
   GEOJSON & ALERTS
========================================================= */

function normalizeName(value) {
  return String(value || "")
    .toLowerCase()
    .replaceAll("’", "'")
    .replaceAll("`", "'")
    .replace(/область$/u, "")
    .replace(/район$/u, "")
    .replace(/області$/u, "")
    .replace(/району$/u, "")
    .replace(/[^а-яіїєґa-z0-9]/giu, "");
}

function getFeatureNames(feature) {
  const props = feature?.properties || {};
  const values = [];
  Object.keys(props).forEach(key => {
    if (typeof props[key] === "string") values.push(props[key]);
  });
  return values;
}

function featureMatchesAlert(feature, alert) {
  const alertName = normalizeName(alert?.name || alert?.region || alert?.title);
  if (!alertName) return false;
  return getFeatureNames(feature).some(name => normalizeName(name) === alertName);
}

function findRaionAlert(feature) {
  return neptunAlerts.find(alert => featureMatchesAlert(feature, alert)) ||
         radarAlerts.find(alert => alert.type === "raion" && featureMatchesAlert(feature, alert)) || null;
}

function findOblastAlert(feature) {
  return neptunAlertOblasts.find(alert => featureMatchesAlert(feature, alert)) ||
         radarAlerts.find(alert => (alert.type === "oblast" || !alert.type) && featureMatchesAlert(feature, alert)) || null;
}

function getAlertStyle(alert, isOblast) {
  const level = String(alert?.level || "").toLowerCase();
  if (level === "yellow") {
    return {
      color: "#ffcc00",
      weight: isOblast ? 3 : 2,
      opacity: 1,
      fillColor: "#ffcc00",
      fillOpacity: isOblast ? 0.10 : 0.18
    };
  }
  return {
    color: "#ff0000",
    weight: isOblast ? 4 : 3,
    opacity: 1,
    fillColor: "#ff0000",
    fillOpacity: isOblast ? 0.16 : 0.28
  };
}

async function loadNeptunGeoJSON() {
  try {
    const [raionResponse, oblastResponse] = await Promise.all([
      fetch(RAIONS_GEOJSON_URL + "?t=" + Date.now(), { cache: "no-store" }),
      fetch(OBLASTS_GEOJSON_URL + "?t=" + Date.now(), { cache: "no-store" })
    ]);

    if (!raionResponse.ok || !oblastResponse.ok) throw new Error("GeoJSON fetch error");

    const newRaionsGeoJSON = await raionResponse.json();
    const newOblastsGeoJSON = await oblastResponse.json();

    if (!newRaionsGeoJSON?.features || !newOblastsGeoJSON?.features) {
      throw new Error("Некоректний GeoJSON");
    }

    raionsGeoJSON = newRaionsGeoJSON;
    oblastsGeoJSON = newOblastsGeoJSON;

    renderAlertZones();
    await saveOfflineState();
    updateStatus();
  } catch (error) {
    console.error("GeoJSON NEPTUN:", error);
    renderAlertZones();
    updateStatus();
  }
}

function renderAlertZones() {
  neptunRaionLayerGroup.clearLayers();
  neptunOblastLayerGroup.clearLayers();

  if (oblastsGeoJSON?.features) {
    oblastsGeoJSON.features.forEach(feature => {
      const alert = findOblastAlert(feature);
      if (!alert) return;

      const layer = L.geoJSON(feature, {
        style: getAlertStyle(alert, true),
        interactive: false
      });

      layer._category = NEPTUN_CATEGORY_ALERT;
      layer._neptunAlert = true;
      layer.bindTooltip(`🚨 ${alert.name || alert.region}<br>Рівень: ${alert.level || "активна"}`, { sticky: true });
      layer.addTo(neptunOblastLayerGroup);
    });
  }

  if (raionsGeoJSON?.features) {
    raionsGeoJSON.features.forEach(feature => {
      const alert = findRaionAlert(feature);
      if (!alert) return;

      const layer = L.geoJSON(feature, {
        style: getAlertStyle(alert, false),
        interactive: false
      });

      layer._category = NEPTUN_CATEGORY_ALERT;
      layer._neptunAlert = true;
      layer.bindTooltip(`🚨 ${alert.name || alert.region}<br>Рівень: ${alert.level || "активна"}`, { sticky: true });
      layer.addTo(neptunRaionLayerGroup);
    });
  }

  updateVisibility();
}

/* =========================================================
   THREATS
========================================================= */

function getNeptunThreatCategory(threat) {
  return NEPTUN_CATEGORY_UAV;
}

function getThreatPosition(threat) {
  try {
    if (window.NEPTUN && typeof NEPTUN.predict === "function") {
      const predicted = NEPTUN.predict(threat, Date.now());
      if (predicted && Number.isFinite(Number(predicted.lat)) && Number.isFinite(Number(predicted.lon))) {
        return [Number(predicted.lat), Number(predicted.lon)];
      }
    }
  } catch (error) {
    console.warn("NEPTUN predict error:", error);
  }

  if (Number.isFinite(Number(threat?.lat)) && Number.isFinite(Number(threat?.lon))) {
    return [Number(threat.lat), Number(threat.lon)];
  }
  return null;
}

function getThreatTitle(threat) {
  const type = normalizeType(threat?.type);
  if (type === "uav") return "✈️ Шахед / БпЛА";
  if (type === "missile" || type === "rocket") return "🚀 Ракета";
  if (threat?.title) return String(threat.title);
  if (threat?.name) return String(threat.name);
  return "✈️ Повітряна загроза";
}

function renderNeptunThreats() {
  neptunThreatLayerGroup.clearLayers();

  neptunThreats.forEach(threat => {
    if (threat?.areaOnly === true) return;

    const position = getThreatPosition(threat);
    if (!position) return;

    const marker = L.marker(position, {
      icon: createNeptunThreatIcon(threat.type)
    });

    marker.bindPopup(`
      <b>${getThreatTitle(threat)}</b><br><br>
      Будьте обережні та залишайтеся в безпеці!
      ${threat.advisory ? "<br><br>⚠️ Спостереження (advisory)" : ""}
      <br><br>від NEPTUN
    `);

    marker._category = NEPTUN_CATEGORY_UAV;
    marker._neptunThreat = true;
    marker.addTo(neptunThreatLayerGroup);
  });

  updateVisibility();
}

async function loadNeptunAlerts() {
  try {
    const response = await fetch(NEPTUN_ALERTS_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();

    if (!Array.isArray(data?.raions) || !Array.isArray(data?.oblasts)) {
      throw new Error("Некоректна структура alerts");
    }

    neptunAlerts = data.raions;
    neptunAlertOblasts = data.oblasts;

    renderAlertZones();
    updateCategoryCounts();
    updateStatus();
    await saveOfflineState();
  } catch (error) {
    console.error("NEPTUN alerts:", error);
    updateStatus();
  }
}

async function loadNeptunThreats() {
  try {
    const response = await fetch(NEPTUN_THREATS_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();

    let newThreats = Array.isArray(data) ? data : (Array.isArray(data?.threats) ? data.threats : null);
    if (!newThreats) throw new Error("Некоректні threats");

    neptunThreats = newThreats;
    renderNeptunThreats();
    updateCategoryCounts();
    updateStatus();
    await saveOfflineState();
  } catch (error) {
    console.error("NEPTUN threats:", error);
    updateStatus();
  }
}

/* =========================================================
   STATUS & REALTIME
========================================================= */

function updateStatus() {
  const status = document.getElementById("status");
  if (!status) return;

  const alerts = neptunAlerts.length + neptunAlertOblasts.length + radarAlerts.length;
  const uavs = neptunThreats.length;
  const news = sheetObjects.filter(obj => getSheetCategory(obj) === "13").length;

  let cacheText = offlineCacheLoaded ? (offlineCacheSavedAt ? formatCacheAge(offlineCacheSavedAt) : "збережено") : "порожній";
  const networkText = navigator.onLine ? "🟢 ОНЛАЙН" : "🔴 ОФЛАЙН";

  status.innerHTML = `
    ${networkText}<br>
    Кеш: ${cacheText}<br><br>
    Google Sheets: ${sheetObjects.length}<br>
    📰 Новин: ${news}<br>
    🚨 Тривог (NEPTUN+Radar): ${alerts}<br>
    ✈️ Загроз: ${uavs}
  `;
}

let neptunRealtimeClient = null;

function startNeptunRealtime() {
  try {
    if (!window.NEPTUN || typeof NEPTUN.RealtimeClient !== "function") return;

    neptunRealtimeClient = new NEPTUN.RealtimeClient(NEPTUN_URL);
    neptunRealtimeClient.subscribe(snapshot => {
      let changed = false;

      if (Array.isArray(snapshot?.threats)) {
        neptunThreats = snapshot.threats;
        changed = true;
        renderNeptunThreats();
      }

      if (Array.isArray(snapshot?.alerts)) {
        neptunAlerts = snapshot.alerts;
        changed = true;
      }

      if (Array.isArray(snapshot?.alertOblasts)) {
        neptunAlertOblasts = snapshot.alertOblasts;
        changed = true;
      }

      if (changed) {
        renderAlertZones();
        updateCategoryCounts();
        updateStatus();
        saveOfflineState();
      }
    });

    neptunRealtimeClient.start();
  } catch (error) {
    console.error("NEPTUN realtime:", error);
  }
}

map.on("zoomend", renderNeptunThreats);

window.addEventListener("resize", function() {
  if (window.innerWidth > 600) {
    panel.classList.remove("panel-open");
    panelToggle.textContent = "☰";
  }
});

/* =========================================================
   INIT
========================================================= */

async function init() {
  createCategoryPanel();

  try {
    await restoreOfflineState();
  } catch (error) {
    console.warn("OFFLINE restore:", error);
  }

  updateVisibility();
  updateStatus();

  const networkLoads = [
    loadNeptunGeoJSON(),
    loadSheetData(),
    loadNeptunAlerts(),
    loadRadarAlerts(),
    loadNeptunThreats()
  ];

  await Promise.allSettled(networkLoads);

  if (navigator.onLine) {
    startNeptunRealtime();
  }

  setInterval(() => { if (navigator.onLine) loadSheetData(); }, 15000);
  setInterval(() => { if (navigator.onLine) { loadNeptunAlerts(); loadRadarAlerts(); } }, 10000);
  setInterval(() => { if (navigator.onLine) loadNeptunThreats(); }, 10000);
  setInterval(updateStatus, 30000);

  updateVisibility();
  updateStatus();
}

init();

</script>
