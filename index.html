<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#10141b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="МапаПодійUA">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>МапаПодійUA</title>
<style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#10141b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#mapFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#111}
#offlineBar{display:none;position:absolute;z-index:20;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));padding:10px 12px;border:1px solid #293241;border-radius:12px;background:rgba(23,29,38,.96);font-size:14px}
#install{display:none;position:absolute;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:min(92%,430px);padding:14px 16px;border:1px solid #293241;border-radius:16px;background:rgba(23,29,38,.98);box-shadow:0 10px 35px rgba(0,0,0,.35)}
#install strong{display:block;margin-bottom:5px}#install p{margin:0 0 10px;color:#aab4c3;font-size:13px;line-height:1.4}.row{display:flex;gap:8px}button{flex:1;border:0;border-radius:10px;padding:11px 12px;font-weight:700}#installBtn{background:#4da3ff;color:#fff}#closeBtn{background:#2a313c;color:#fff}
</style>
</head>
<body>
<div id="app">
<iframe id="mapFrame" title="МапаПодійUA — карта" src="./map.html" allow="geolocation; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="offlineBar">⚠️ Немає підключення до інтернету. Оболонка доступна, але актуальні події можуть не оновлюватися.</div>
<div id="install"><strong>📱 Встановити МапаПодійUA</strong><p>Додайте застосунок на головний екран, щоб відкривати карту як окремий застосунок без адресного рядка браузера.</p><div class="row"><button id="installBtn">Встановити</button><button id="closeBtn">Не зараз</button></div></div>
</div>
<script>
(()=> {
const box=document.getElementById("install"), installBtn=document.getElementById("installBtn"), closeBtn=document.getElementById("closeBtn"), offline=document.getElementById("offlineBar");
let deferredPrompt=null;
function net(){offline.style.display=navigator.onLine?"none":"block"} window.addEventListener("online",net);window.addEventListener("offline",net);net();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(console.warn));
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(!window.matchMedia("(display-mode: standalone)").matches && localStorage.getItem("mapadoua-install-dismissed")!=="1")box.style.display="block"});
installBtn.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;box.style.display="none"};
closeBtn.onclick=()=>{box.style.display="none";localStorage.setItem("mapadoua-install-dismissed","1")};
window.addEventListener("appinstalled",()=>{box.style.display="none";deferredPrompt=null});
})();
</script>
</body>
</html>
